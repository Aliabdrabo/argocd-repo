apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-helm-lab
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/Aliabdrabo/argocd-repo.git
    targetRevision: main
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-lab

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
